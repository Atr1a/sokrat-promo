<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Игра-тест детского клуба «Сократ»: узнайте суперсилу ребёнка, подходящие занятия и получите скидку на первый абонемент.">
<title>Кем станет герой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: как у черновика сайта — стиль афиш клуба: кремовый фон, шоколадный текст, разноцветные буквы, жёлтые кнопки-«конфеты».
   Игра идёт по одной карточке-экрану; сверху — тропинка из звёзд, по которой шагает выбранный герой. Одна светлая тема, как на афишах. */
:root {
  color-scheme: light;
  --bg: #FFF7EC; --band: #FDEEDB; --surface: #FFFFFF;
  --ink: #4A2A1F; --muted: #80604F; --line: #EEDCC6;
  --sun: #FFC928; --sun-soft: #FFF0BF; --on-sun: #4A2A1F; --sun-edge: #E3A800;
  --red: #E8432E; --orange: #F5922A; --gold: #F2AE00; --green: #4FAF45; --blue: #2E8FD6; --purple: #8A55C4; --pink: #E5508F;
  --c-sport: #3E9E3A; --c-sport-soft: #E2F4DC;
  --c-art: #DB3F84;   --c-art-soft: #FCE2EE;
  --c-stage: #EF7F1A; --c-stage-soft: #FFE9D2;
  --c-logic: #2E8FD6; --c-logic-soft: #DFF0FC;
  --c-lang: #8A55C4;  --c-lang-soft: #EEE4FA;
  --c-build: #C49000; --c-build-soft: #FFF0BF;
  --pen: #C42F4A; --pen-soft: #FBE9EC;
  --shadow: 0 2px 4px rgba(74, 42, 31, .05), 0 12px 28px rgba(74, 42, 31, .08);
  --f-display: "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 24px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 10px; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.rainbow span:nth-child(7n+1) { color: var(--red); } .rainbow span:nth-child(7n+2) { color: var(--orange); } .rainbow span:nth-child(7n+3) { color: var(--gold); }
.rainbow span:nth-child(7n+4) { color: var(--green); } .rainbow span:nth-child(7n+5) { color: var(--blue); } .rainbow span:nth-child(7n+6) { color: var(--purple); } .rainbow span:nth-child(7n+7) { color: var(--pink); }

/* Шапка */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 8px; }
.logo img { height: 52px; width: auto; display: block; }
.game-pill { font-size: .78rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; background: var(--sun); color: var(--on-sun); border-radius: 999px; padding: 5px 12px; }
.top-phone { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) { .top-phone { display: none; } .logo img { height: 44px; } .game-pill { margin-left: auto; } }

/* Кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 900 1.1rem/1 var(--f-body); border-radius: 999px; padding: 18px 30px; border: 0; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, box-shadow .15s; }
.btn-sun { background: var(--sun); color: var(--on-sun); box-shadow: 0 5px 0 var(--sun-edge), 0 12px 24px rgba(242, 174, 0, .32); }
.btn-sun:hover { transform: translateY(-2px); }
.btn-sun:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sun-edge); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--ink); padding: 14px 22px; font-size: 1rem; }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.link-btn { background: none; border: 0; padding: 8px 4px; cursor: pointer; font-weight: 800; color: var(--muted); }
.link-btn:hover { color: var(--ink); }

main { padding-block: 28px 64px; }
.screen { animation: pop .45s cubic-bezier(.3, 1.3, .5, 1); }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: .2; } }

/* Старт */
.start { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 32px; align-items: center; padding-top: 12px; }
.start h1 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(2.3rem, 7vw, 4.2rem); line-height: .98; letter-spacing: -.01em; }
.start h1 .brown { display: block; color: var(--ink); margin-top: .1em; font-size: .62em; }
.start .lead { color: var(--muted); font-size: 1.15rem; margin-top: 18px; max-width: 30rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.facts span { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: .92rem; }
.start .cta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 28px; }
.gift-hint { display: flex; gap: 12px; align-items: center; margin-top: 26px; background: var(--surface); border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow); max-width: 30rem; }
.gift-hint .g { font-size: 2rem; line-height: 1; }
.gift-hint b { display: block; font-weight: 900; }
.gift-hint small { color: var(--muted); font-weight: 600; font-size: .9rem; }
.stage-art { position: relative; max-width: 420px; width: 100%; justify-self: center; aspect-ratio: 1; }
.stage-art svg { width: 100%; height: 100%; display: block; }
.orbit { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; background: var(--surface); box-shadow: var(--shadow); }
.orbit:nth-of-type(1) { left: 2%; top: 14%; } .orbit:nth-of-type(2) { right: 0; top: 6%; } .orbit:nth-of-type(3) { right: -2%; bottom: 22%; }
.orbit:nth-of-type(4) { left: 4%; bottom: 8%; } .orbit:nth-of-type(5) { left: 40%; bottom: -4%; } .orbit:nth-of-type(6) { left: 38%; top: -4%; }
.rays { transform-origin: 200px 200px; }
@media (prefers-reduced-motion: no-preference) { .rays { animation: spin 60s linear infinite; } .orbit { animation: bob 5s ease-in-out infinite; } .orbit:nth-of-type(2n) { animation-delay: -2.5s; } .orbit:nth-of-type(3n) { animation-delay: -1.2s; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-8px); } }
@media (max-width: 820px) { .start { grid-template-columns: 1fr; } .stage-art { max-width: 300px; order: -1; } .orbit { width: 52px; height: 52px; font-size: 1.6rem; } }

/* Тропинка прогресса */
.trail { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.trail .back { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 900; font-size: 1.2rem; }
.trail .back:disabled { opacity: .35; cursor: default; }
.path { position: relative; flex: 1; height: 44px; min-width: 0; }
.path .road { position: absolute; left: 0; right: 0; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 4px; background: repeating-linear-gradient(90deg, var(--line) 0 12px, transparent 12px 20px); }
.path .done { position: absolute; left: 0; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--orange), var(--gold), var(--green), var(--blue), var(--purple), var(--pink)); transition: width .5s cubic-bezier(.3, 1.3, .5, 1); }
.path .st { position: absolute; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); font-size: 15px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); color: transparent; transition: transform .3s; }
.path .st.got { background: var(--sun); border-color: var(--sun-edge); color: var(--on-sun); transform: translate(-50%, -50%) scale(1.15); }
.path .walker { position: absolute; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -62%); font-size: 30px; line-height: 40px; text-align: center; transition: left .5s cubic-bezier(.3, 1.3, .5, 1); filter: drop-shadow(0 3px 4px rgba(74, 42, 31, .25)); }
.stars-count { flex: none; font-weight: 900; font-variant-numeric: tabular-nums; background: var(--surface); border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); white-space: nowrap; }

/* Карточка вопроса */
.qcard { background: var(--surface); border-radius: 32px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); position: relative; overflow: hidden; }
.qcard::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; border: 26px solid var(--sun-soft); pointer-events: none; }
.qhead { display: grid; gap: 10px; margin-bottom: 24px; position: relative; z-index: 1; max-width: 40rem; }
.qnum { justify-self: start; font-size: .8rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--on-sun); background: var(--sun); border-radius: 999px; padding: 5px 13px; }
.qnum.adult { background: var(--ink); color: var(--bg); }
.qhead h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.5rem, 4vw, 2.3rem); line-height: 1.08; }
.qhead p { color: var(--muted); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; position: relative; z-index: 1; }
@media (max-width: 720px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.opt { --c: var(--ink); --cs: var(--band); position: relative; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 20px 12px 18px; border-radius: 22px; border: 3px solid var(--cs); background: var(--cs); cursor: pointer; font-weight: 800; font-size: 1.02rem; line-height: 1.25; transition: transform .15s, border-color .15s, box-shadow .15s; min-width: 0; }
.opt .em { width: 72px; height: 72px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 2.4rem; line-height: 1; box-shadow: 0 4px 0 rgba(74, 42, 31, .08); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.opt:hover { transform: translateY(-3px); border-color: var(--c); }
.opt:hover .em { transform: rotate(-8deg) scale(1.08); }
.opt.picked { border-color: var(--c); background: var(--c); color: #fff; transform: scale(1.03); box-shadow: 0 10px 24px rgba(74, 42, 31, .18); }
.opt.picked .em { transform: scale(1.15) rotate(6deg); }
.opt { overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.qhead h2, .hero-card h2, .pick-body h3, .school-zone h3 { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.qnum.school { background: var(--blue); color: #fff; }
.opt small { display: block; font-weight: 600; font-size: .85rem; opacity: .8; }
@media (max-width: 720px) { .opt { padding: 16px 8px 14px; font-size: .95rem; } .opt .em { width: 60px; height: 60px; font-size: 2rem; } }
.opt.age { gap: 2px; padding-block: 22px; }
.opt.age b { font-family: var(--f-display); font-weight: 900; font-size: 2.4rem; line-height: 1; color: var(--c); }
.opt.age.picked b { color: #fff; }
.c-sport { --c: var(--c-sport); --cs: var(--c-sport-soft); } .c-art { --c: var(--c-art); --cs: var(--c-art-soft); } .c-stage { --c: var(--c-stage); --cs: var(--c-stage-soft); }
.c-logic { --c: var(--c-logic); --cs: var(--c-logic-soft); } .c-lang { --c: var(--c-lang); --cs: var(--c-lang-soft); } .c-build { --c: var(--c-build); --cs: var(--c-build-soft); }
.c-red { --c: var(--red); --cs: #FDE3DF; } .c-gold { --c: var(--gold); --cs: var(--sun-soft); }

.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 460px; }
.name-row { display: grid; gap: 8px; margin-bottom: 18px; max-width: 460px; position: relative; z-index: 1; }
.name-row label { font-weight: 800; font-size: .95rem; }
.name-row input { font: 800 1.3rem var(--f-body); color: var(--ink); background: var(--bg); border: 3px solid var(--line); border-radius: 18px; padding: 14px 18px; width: 100%; }
.name-row input:focus { border-color: var(--blue); outline: none; }
.name-next { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-top: 20px; position: relative; z-index: 1; }
.err { color: var(--pen); font-weight: 800; }
/* Летящая звезда и реплика героя */
.fly { position: fixed; z-index: 50; font-size: 28px; pointer-events: none; transition: transform .7s cubic-bezier(.5, -0.3, .6, 1), opacity .7s; }
.speech { display: flex; align-items: center; gap: 10px; margin-top: 18px; min-height: 48px; position: relative; z-index: 1; }
.speech .face { width: 48px; height: 48px; border-radius: 50%; background: var(--sun-soft); display: grid; place-items: center; font-size: 1.8rem; flex: none; }
.speech .bubble { background: var(--band); border-radius: 18px; border-bottom-left-radius: 6px; padding: 10px 16px; font-weight: 700; }

/* Подсчёт */
.counting { text-align: center; padding: 60px 20px; display: grid; gap: 18px; justify-items: center; }
.counting .big { font-size: 4.5rem; line-height: 1; }
@media (prefers-reduced-motion: no-preference) { .counting .big { animation: wob 0.9s ease-in-out infinite; } }
@keyframes wob { 50% { transform: rotate(-12deg) scale(1.1); } }
.counting h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 1.6rem; }

/* Результат */
.result { display: grid; gap: 22px; }
.hero-card { border-radius: 32px; padding: clamp(22px, 4vw, 40px); background: var(--cs); position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.hero-card > * { position: relative; z-index: 1; }
.hero-card::before { content: ""; position: absolute; right: -40px; bottom: -70px; width: 260px; height: 260px; border-radius: 50%; border: 34px solid rgba(255, 255, 255, .55); }
.badge { position: relative; width: 150px; height: 150px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); }
.badge .ani { font-size: 4rem; line-height: 1; }
.badge .pow { position: absolute; right: -6px; bottom: 2px; width: 58px; height: 58px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 1.8rem; border: 4px solid var(--surface); }
.hero-card .kicker { font-size: .82rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--c); }
.hero-card h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.02; margin: 6px 0 10px; color: var(--ink); }
.hero-card p { font-size: 1.08rem; max-width: 36rem; position: relative; }
@media (max-width: 600px) { .hero-card { grid-template-columns: 1fr; justify-items: start; } .badge { width: 120px; height: 120px; } .badge .ani { font-size: 3.2rem; } }

.sec-title { font-weight: 900; text-transform: uppercase; font-size: 1rem; letter-spacing: .04em; }

.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .picks { grid-template-columns: 1fr; } }
.pick { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pick-top { background: var(--cs); color: var(--c); padding: 12px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .76rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; }
.pick-top .match { background: var(--c); color: #fff; border-radius: 999px; padding: 3px 10px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.pick-body { padding: 16px 18px 20px; display: grid; gap: 10px; align-content: start; flex: 1; }
.pick-body h3 { color: var(--c); text-transform: uppercase; font-weight: 900; font-size: 1.16rem; line-height: 1.2; }
.pick-body .why { font-weight: 700; font-size: .93rem; }
.pick-body .desc { color: var(--muted); font-size: .92rem; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 9px; }
.agechip { justify-self: start; font-size: .82rem; font-weight: 800; color: var(--c); background: var(--cs); border-radius: 999px; padding: 3px 11px; }
.pricing { display: grid; gap: 2px; font-variant-numeric: tabular-nums; border-top: 1.5px dashed var(--line); padding-top: 10px; margin-top: auto; }
.pricing .free { color: var(--green); font-weight: 900; }
.pricing .old { text-decoration: line-through; color: var(--muted); font-weight: 700; margin-right: 6px; }
.pricing .new { font-weight: 900; color: var(--red); }

/* Школа «Сократ» для будущих первоклассников */
.school-zone { background: var(--c-logic-soft); border-radius: 32px; padding: clamp(20px, 4vw, 36px); display: grid; gap: 20px; position: relative; overflow: hidden; }
.school-zone::before { content: ""; position: absolute; right: -50px; top: -50px; width: 200px; height: 200px; border-radius: 50%; border: 30px solid rgba(255, 255, 255, .6); }
.school-zone > * { position: relative; z-index: 1; }
.school-head { display: grid; gap: 8px; max-width: 40rem; }
.school-head .kicker { justify-self: start; font-size: .8rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; background: var(--blue); color: #fff; border-radius: 999px; padding: 5px 13px; }
.school-head h3 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.4rem, 3.6vw, 2.1rem); line-height: 1.08; }
.school-head h3 span { color: var(--blue); }
.school-head p { font-size: 1.05rem; }
.adv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .adv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
@media (max-width: 420px) { .adv-grid { grid-template-columns: 1fr; } }
.adv { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 12px; align-content: start; position: relative; border: 3px solid transparent; }
.adv .ic { grid-row: span 2; width: 48px; height: 48px; border-radius: 50%; background: var(--c-logic-soft); display: grid; place-items: center; font-size: 1.6rem; }
.adv b { font-weight: 900; line-height: 1.25; overflow-wrap: break-word; }
.adv p { font-size: .9rem; color: var(--muted); }
.adv.mine { border-color: var(--blue); }
.adv.mine::after { content: attr(data-mine); position: absolute; right: 12px; top: -12px; background: var(--blue); color: #fff; font-size: .74rem; font-weight: 900; border-radius: 999px; padding: 3px 10px; }
.bridge { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: b; }
@media (max-width: 760px) { .bridge { grid-template-columns: 1fr; } }
.bridge div { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: grid; gap: 4px; font-size: .93rem; }
.bridge div b { font-weight: 900; color: var(--blue); text-transform: uppercase; font-size: .82rem; letter-spacing: .05em; }
.bridge div:nth-child(1) b { color: var(--orange); } .bridge div:nth-child(3) b { color: var(--green); }
.school-cta { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--blue); color: #fff; border-radius: 20px; padding: 16px 20px; }
.school-cta p { font-weight: 700; max-width: 34rem; }
.school-cta a { color: #fff; font-weight: 900; white-space: nowrap; background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 10px 18px; text-decoration: none; }
.school-cta a:hover { background: rgba(255, 255, 255, .3); }
/* Сундук и купон */
.chest-zone { background: var(--ink); color: var(--bg); border-radius: 32px; padding: clamp(24px, 4vw, 40px); display: grid; gap: 18px; justify-items: center; text-align: center; position: relative; overflow: hidden; }
.chest-zone h3 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.1; color: var(--sun); }
.chest-zone p { opacity: .9; max-width: 32rem; }
.chest { width: 170px; height: 150px; border: 0; background: none; cursor: pointer; padding: 0; position: relative; }
.chest svg { width: 100%; height: 100%; overflow: visible; }
.chest .lid { transform-origin: 30px 62px; transition: transform .5s cubic-bezier(.3, 1.5, .5, 1); }
.chest.open .lid { transform: rotate(-28deg) translateY(-10px); }
@media (prefers-reduced-motion: no-preference) { .chest:not(.open) { animation: shake 2.4s ease-in-out infinite; } }
@keyframes shake { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-5deg); } 88% { transform: rotate(5deg); } 92% { transform: rotate(-3deg); } 96% { transform: rotate(2deg); } }
.ticket { width: min(560px, 100%); background: var(--sun); color: var(--on-sun); border-radius: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; position: relative; text-align: left; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); animation: pop .6s cubic-bezier(.3, 1.4, .5, 1); }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 142px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); }
.ticket::before { top: -13px; } .ticket::after { bottom: -13px; }
.ticket .main { padding: 22px 24px; display: grid; gap: 6px; }
.ticket .pct { font-family: var(--f-display); font-weight: 900; font-size: 3.6rem; line-height: .9; color: var(--red); }
.ticket .what { font-weight: 900; font-size: 1.08rem; }
.ticket .terms { font-size: .88rem; font-weight: 600; }
.ticket .stub { width: 155px; border-left: 3px dashed rgba(74, 42, 31, .35); padding: 18px 14px; display: grid; gap: 6px; align-content: center; justify-items: center; }
.ticket .stub small { font-size: .72rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.ticket .code { font-family: var(--f-mono); font-weight: 600; font-size: 1.12rem; background: var(--surface); border-radius: 10px; padding: 6px 8px; user-select: all; white-space: nowrap; }
.mini { font: 800 .82rem var(--f-body); border: 2px solid var(--on-sun); background: transparent; color: var(--on-sun); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
@media (max-width: 520px) { .ticket { grid-template-columns: 1fr; } .ticket .stub { width: auto; border-left: 0; border-top: 3px dashed rgba(74, 42, 31, .35); } .ticket::before, .ticket::after { right: auto; top: auto; bottom: auto; } .ticket::before { display: none; } .ticket::after { display: none; } }
.next-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: min(760px, 100%); text-align: left; counter-reset: s; }
.next-steps div { background: rgba(255, 255, 255, .08); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; font-size: .92rem; }
.next-steps div::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--sun); color: var(--on-sun); display: grid; place-items: center; font-weight: 900; }
.next-steps b { color: var(--surface); }
@media (max-width: 700px) { .next-steps { grid-template-columns: 1fr; } }
.contacts { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; align-items: center; }
.contacts .phone { font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; font-variant-numeric: tabular-nums; user-select: all; color: var(--surface); }
.contacts a { color: var(--sun); font-weight: 800; }
.copy-dark { font: 800 .86rem var(--f-body); color: var(--bg); background: transparent; border: 1.5px solid currentColor; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.again { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

footer { padding-block: 26px 40px; border-top: 1px solid var(--line); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; align-items: center; color: var(--muted); font-size: .88rem; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); font-weight: 800; border-radius: 999px; padding: 12px 20px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }
</style>

function fresh() { return { step: -1, name: "", gender: null, age: null, hero: null, answers: {}, code: null, until: null, opened: false }; }
function save() { try { localStorage.setItem("sokrat-geroy-2", JSON.stringify(S)); } catch (e) {} }

/* ---------- Подсчёт ---------- */
function scores() {
  const s = { sport: 0, art: 0, stage: 0, logic: 0, lang: 0, build: 0 }; const flags = {};
  qs().forEach(q => { const a = S.answers[q.id]; if (a == null || q.school) return; const o = q.o[a]; const k = q.adult ? 2 : 1;
    s[o[2]] += k; if (o[4]) s[o[4]] += k; if (o[3]) flags[o[3]] = 1; });
  return { s, flags };
}
function results() {
  const { s, flags } = scores();
  const max = Math.max(1, ...Object.values(s));
  const order = Object.keys(s).sort((a, b) => s[b] - s[a]);
  const age = S.age;
  const fit = D.filter(d => age >= d.r[0] && age < d.r[1]).map(d => {
    let pts = 0, maxPts = 0;
    for (const k in d.w) { pts += d.w[k] * s[k]; }
    maxPts = 3 * max;
    if (flags.school && d.school) pts += d.school * 2;
    if (flags.eng && d.eng) pts += d.eng * 2;
    const top = Object.keys(d.w).sort((a, b) => d.w[b] * s[b] - d.w[a] * s[a])[0];
    return { d, pts, top, match: Math.min(98, Math.round(62 + 36 * pts / (maxPts + 4))) };
  }).sort((a, b) => b.pts - a.pts);
  /* не больше двух направлений одной «суперсилы», чтобы выбор был разнообразнее */
  const picks = []; const used = {};
  for (const f of fit) { if (picks.length === 3) break; if ((used[f.top] || 0) >= 2) continue; picks.push(f); used[f.top] = (used[f.top] || 0) + 1; }
  for (const f of fit) { if (picks.length === 3) break; if (!picks.includes(f)) picks.push(f); }
  const best = Math.max(1, picks[0] ? picks[0].pts : 1);
  picks.forEach((p, i) => { p.match = Math.max(68, Math.round(96 - 28 * (1 - p.pts / best)) - i * 2); });
  return { s, max, order, picks, speech: flags.speech && age >= 3 };
}

function choose(i, btn) {

function flyStar(from) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const a = from.getBoundingClientRect(), t = document.getElementById("starsCount").getBoundingClientRect();
  const s = document.createElement("span"); s.className = "fly"; s.textContent = "⭐";
  s.style.left = a.left + a.width / 2 - 14 + "px"; s.style.top = a.top + a.height / 2 - 14 + "px"; document.body.appendChild(s);
  requestAnimationFrame(() => { s.style.transform = `translate(${t.left - a.left - a.width / 2 + 20}px, ${t.top - a.top - a.height / 2 + 4}px) scale(.7)`; s.style.opacity = ".2"; });

    <div class="hero-card c-${main.c}">
      <div class="badge"><span class="ani">${hero.em}</span><span class="pow">${main.em}</span></div>
      <div><span class="kicker">${esc(NAME())}, твоя суперсила</span><h2>${L(main.hero)}</h2><p>${L(main.text)} А ещё у ${g("него", "неё")} сильная сторона — <b>${second.name.toLowerCase()}</b>.</p></div>
    </div>
    <div><h3 class="sec-title" style="margin-bottom:12px">Занятия в «Сократе», которые подойдут ${g("ему", "ей")}</h3><div class="picks">${cards}${speech}</div></div>
    ${isFirst() ? schoolZone() : ""}
    <div class="chest-zone">
      <h3 id="chestTitle">${S.opened ? "Подарок для родителей" : `${esc(NAME())} ${g("нашёл", "нашла")} сундук!`}</h3>
      <p id="chestText">${S.opened ? "Покажите этот код администратору при записи — скидка закреплена за вами." : "Нажмите на сундук, чтобы забрать подарок"}</p>
      <div id="chestSlot">${S.opened ? ticket(until) : `<button class="chest" id="chest" type="button" aria-label="Открыть сундук">${chestSvg()}</button>`}</div>
      <div class="next-steps">
        <div><b>Позвоните или напишите</b>Скажите, что прошли игру, и назовите код</div>
        <div><b>Приходите на пробное</b>Первое занятие в клубе — бесплатно</div>
        <div><b>Покупайте со скидкой</b>Минус ${DISCOUNT}% на первый абонемент по коду</div>
      </div>
      <div class="contacts"><span class="phone" id="phone">8 (8442) 20-20-23</span><button class="copy-dark" id="copyPhone" type="button">Скопировать номер</button><a href="https://vk.com/sokrat34" target="_blank" rel="noopener">Написать во ВКонтакте</a></div>
    </div>
    <div class="again"><button class="btn btn-ghost" id="again" type="button">Пройти ещё раз</button><button class="btn btn-ghost" id="share" type="button">Скопировать ссылку на игру</button></div>
  </section>`;
  const ch = document.getElementById("chest"); if (ch) ch.onclick = () => openChest(ch, until);
  document.getElementById("again").onclick = () => { S = fresh(); try { localStorage.removeItem("sokrat-geroy"); } catch (e) {} render(); };
  document.getElementById("copyPhone").onclick = () => copy("8 (8442) 20-20-23", "Номер скопирован", document.getElementById("phone"));
  document.getElementById("share").onclick = () => copy(location.href.split("#")[0], "Ссылка скопирована — отправьте её друзьям");
  bindCode();
}
function schoolZone() {
  const pick = S.answers.school != null ? QSCH.o[S.answers.school] : null;
  const keys = ["walk", "food", "small", "extra", "bag", "play"];
  if (pick) { keys.splice(keys.indexOf(pick[3]), 1); keys.unshift(pick[3]); }
  const cards = keys.map(k => { const a = ADV[k]; const mine = pick && pick[3] === k;
    return `<div class="adv ${mine ? "mine" : ""}" ${mine ? `data-mine="Твой выбор"` : ""}><span class="ic">${a.em}</span><b>${a.t}</b><p>${a.d}</p></div>`; }).join("");
  return `<section class="school-zone">
    <div class="school-head"><span class="kicker">🎒 Будущим первоклассникам</span>
      <h3>${esc(NAME())}, школа мечты уже есть — <span>школа «Сократ»</span></h3>
      <p>${pick ? `Ты ${g("выбрал", "выбрала")} «${esc(pick[1])}». В школе «Сократ» это есть — и ещё много всего.` : "В школе «Сократ» есть всё, что любят дети и ценят родители."}</p></div>
    <div class="adv-grid">${cards}</div>
    <div class="bridge">
      <div><b>Сейчас</b>Раскрываем таланты в клубе «Сократ»: занятия выше подобраны по интересам ${g("сына", "дочки")}</div>
      <div><b>До 1 сентября</b>Поступление в школу: собеседование с ребёнком и демо-версия одного учебного дня</div>
      <div><b>В школе</b>Первый класс — а любимые кружки остаются: дополнительные занятия школьников проходят на базе клуба</div>
    </div>
    <div class="school-cta"><p>Идёт набор в первый класс на новый учебный год. Запишитесь на экскурсию по школе: 8 (8442) 20-20-23</p><a href="${SCHOOL_URL}" target="_blank" rel="noopener">Сайт школы ↗</a></div>
  </section>`;
}
function chestSvg() {
  return `<svg viewBox="0 0 170 150"><ellipse cx="85" cy="140" rx="70" ry="8" fill="#000" opacity=".25"/>
    <rect x="20" y="62" width="130" height="74" rx="10" fill="#C25E12"/><rect x="20" y="62" width="130" height="16" fill="#9C4A0C"/>
    <rect x="34" y="62" width="12" height="74" fill="#FFC928"/><rect x="124" y="62" width="12" height="74" fill="#FFC928"/>
    <rect x="72" y="74" width="26" height="30" rx="5" fill="#FFC928"/><circle cx="85" cy="86" r="4" fill="#4A2A1F"/>
    <g class="lid"><path d="M20 66 Q20 22 85 22 Q150 22 150 66 Z" fill="#E07020"/><rect x="34" y="27" width="12" height="39" fill="#FFC928"/><rect x="124" y="27" width="12" height="39" fill="#FFC928"/></g></svg>`;
}
function ticket(until) {
  return `<div class="ticket"><div class="main"><span class="pct">−${DISCOUNT}%</span><span class="what">на первый абонемент в «Сократе»</span>
    <span class="terms">Запишитесь на бесплатное пробное до ${until} и назовите код администратору.</span></div>
    <div class="stub"><small>Ваш код</small><span class="code" id="code">${S.code}</span><button class="mini" id="copyCode" type="button">Скопировать</button></div></div>`;
}
function bindCode() { const b = document.getElementById("copyCode"); if (b) b.onclick = () => copy(S.code, "Код скопирован", document.getElementById("code")); }
function openChest(ch, until) {
  ch.classList.add("open"); ch.disabled = true; confetti(2200);
  setTimeout(() => { S.opened = true; save();
    document.getElementById("chestTitle").textContent = "Подарок для родителей";
    document.getElementById("chestText").textContent = "Покажите этот код администратору при записи — скидка закреплена за вами.";
    document.getElementById("chestSlot").innerHTML = ticket(until); bindCode(); }, 650);
}
function copy(text, msg, el) {
  const fallback = () => { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Выделено — скопируйте вручную"); } else toast(text); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch (e) { fallback(); }
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }

/* ---------- Конфетти ---------- */
const cv = document.getElementById("confetti"); const cx = cv.getContext("2d");
function confetti(ms) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ["#E8432E", "#F5922A", "#FFC928", "#4FAF45", "#2E8FD6", "#8A55C4", "#E5508F"];
  const P = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26, vy: -Math.random() * 30 - 8, r: (6 + Math.random() * 8) * devicePixelRatio, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 7)], round: Math.random() < .3 }));
  const t0 = performance.now();
  (function tick(t) {
    cx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .9; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.r / 2, 0, 7); cx.fill(); } else cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
    if (t - t0 < ms + 1500) requestAnimationFrame(tick); else cx.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- Запуск ---------- */
load(); render();
</script>
